
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="./style.css">

</head>
<body>

    <div class="container mt-5">

        <h2 class="text-center mb-4">Expense Tracker</h2>

        <!-- Expense Form -->
        <div class="card p-4 shadow">

            <h4 class="mb-3">Add Expense</h4>

            <form id="expenseForm">

                <div class="mb-3">
                    <label class="form-label">Expense Name</label>
                    <input type="text" id="expenseName" class="form-control" placeholder="Enter expense name">
                </div>

                <div class="mb-3">
                    <label class="form-label">Amount</label>
                    <input type="number" id="amount" class="form-control" placeholder="Enter amount">
                </div>

                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <select id="category" class="form-select">
                        <option value="">Select Category</option>
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Education">Education</option>
                        <option value="Others">Others</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Date</label>
                    <input type="date" id="date" class="form-control">
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Add Expense
                </button>

            </form>

        </div>

        <!-- Total Expense -->
        <div class="alert alert-success mt-4 text-center">
            <h4>Total Expense: ₹<span id="total">0</span></h4>
        </div>

        <!-- Category Filter -->
        <div class="mb-3">
            <label class="form-label">Filter by Category</label>

            <select id="filterCategory" class="form-select">
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Education">Education</option>
                <option value="Others">Others</option>
            </select>
        </div>

        <!-- Expense Table -->
        <h4 class="mb-3">Expense Details</h4>

        <table class="table table-bordered table-striped">

            <thead class="table-dark">
                <tr>
                    <th>Expense Name</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="expenseTable">

            </tbody>

        </table>

    </div>
<script src="script.js"></script>
</body>
</html>
</body>
</html>
